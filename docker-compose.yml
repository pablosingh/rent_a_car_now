services:
  postgres:
    image: postgres:16
    container_name: postgres-rentacar
    environment:
      POSTGRES_DB: rentacarnow
      POSTGRES_USER: rentacarnow
      POSTGRES_PASSWORD: rentacarnow
    ports:
      - "5430:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentacarnow -d rentacarnow"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: rentacarnow-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rentacarnow
      SPRING_DATASOURCE_USERNAME: rentacarnow
      SPRING_DATASOURCE_PASSWORD: rentacarnow
      APP_UPLOAD_DIR: /app/uploads/cars
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp-relay.brevo.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@rentacarnow.com}
      APP_MAIL_FROM_NAME: ${APP_MAIL_FROM_NAME:-RentACarNow}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-true}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
    volumes:
      - .:/app
      - ../uploads:/app/uploads

volumes:
  pgdata:
